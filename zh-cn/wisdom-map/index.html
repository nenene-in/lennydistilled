型技能 - 在一个领域深谙其道,在多方面又有广博的涉猎", "url": "/zh-cn/craft/career-growth/the-best-pms-have-t-shaped-skills-deep-in-one-broad-in-many/", "quote": "我确实从未见过那种在中心位置的出色PM。我发现出色的PM总是站在边缘。总会有人在数据科学方面很出色,同时又能出色地进行全面管理和激发团队,或者有人在创意方面很出色,以不同方式领导团队。", "guest": "Hari Srinivasan", "dimension": "产品设计"}, {"text": "做让自己充满活力的事 - 那里是影响力所在", "url": "/zh-cn/craft/career-growth/do-things-that-give-you-energy-thats-where-impact-lives/", "quote": "做那些给你带来能量的事情 - 那里才是真正的影响力所在。", "guest": "Alex Komoroske", "dimension": "产品设计"}, {"text": "人工智能正在重塑一切 - 紧急适应或将失去生存空间", "url": "/zh-cn/strategy/vision-mission/ai-is-reshaping-everything-adapt-urgently-or-become-obsolete/", "quote": "这就像一颗流星正朝你飞来。它将彻底改变社会。如果人们没有正确探索人工智能,他们将会被抛在后面。", "guest": "Paul Adams", "dimension": "战略"}, {"text": "战略是解决具体问题,而不是设定宏大目标", "url": "/zh-cn/strategy/vision-mission/strategy-is-solving-specific-problems-not-setting-ambitious/", "quote": "你应该能够从公司的使命一直追溯到团队内部的具体优先事项,并看到其中的逻辑链条,以及为什么会得出这样的结果。", "guest": "Maggie Crowley", "dimension": "战略"}, {"text": "组织结构决定产品成果", "url": "/zh-cn/leadership/org-design/organizational-structure-determines-product-outcomes/", "quote": "不同类型的产品经理有不同的技能和适用的场景,关键在于选对人才来解决特定问题。", "guest": "Brian Tolkin", "dimension": "领导力"}, {"text": "AI会扁平化组织并模糊角色边界", "url": "/zh-cn/leadership/org-design/ai-will-flatten-organizations-and-blur-roles/", "quote": "我们正进入一个组织中的各种角色和职能界限都会消失的时代,每个人都能自己做更多事情,不再需要依赖他人。", "guest": "Scott Belsky", "dimension": "领导力"}, {"text": "为口碑而不是渐进式改进而构建", "url": "/zh-cn/growth/acquisition/build-for-word-of-mouth-not-incremental-improvement/", "quote": "只有根本上有差异的产品才能让客户向朋友推荐。微小的改进不足以突破噪音,而噪音的程度在过去15年里已经大大提高。", "guest": "Jag Duggal", "dimension": "增长"}, {"text": "热爱转化用户为拥护者", "url": "/zh-cn/growth/acquisition/love-transforms-users-into-champions/", "quote": "除非你真正相信某件事情,否则你无法做到这一点。因此仅仅使用产品是不够的,还需要让用户从单纯的用户转变为拥护者。", "guest": "Claire Butler", "dimension": "增长"}, {"text": "快速发布以学习,而不是为了证明自己正确", "url": "/zh-cn/execution/shipping-velocity/ship-to-learn-not-to-be-right/", "quote": "我们有一个原则叫' 快速发布以学习&#x27;。快速发布、尽早发布、频繁发布。这其中包含了失败的可能性。它不会总是对的,相反,更多时候会出错。&quot;, &quot;guest&quot;: &quot;paul adams&quot;, &quot;dimension&quot;: &quot;执行&quot;}, {&quot;text&quot;: &quot;够好就好于完美&quot;, &quot;url&quot;: &quot; zh-cn execution shipping-velocity good-enough-beats-perfect &quot;, &quot;quote&quot;: &quot;完美并不存在,不如追求&#x27;够好&#x27;就好。因为在发布时,你才能从用户那里学到很多无法预料的东西。&quot;, &quot;guest&quot;: &quot;julia schottenstein&quot;, &quot;dimension&quot;: &quot;执行&quot;}, {&quot;text&quot;: &quot;从问题开始,而不是解决方案&quot;, &quot;url&quot;: &quot; zh-cn discovery problem-identification start-with-the-problem-not-the-solution &quot;, &quot;quote&quot;: &quot;花更多时间在问题上,而不是解决方案。&quot;, &quot;guest&quot;: &quot;christopher lochhead&quot;, &quot;dimension&quot;: &quot;发现&quot;}, {&quot;text&quot;: &quot;你的用户懒惰、自私、虚荣——请据此设计产品&quot;, &quot;url&quot;: &quot; zh-cn discovery user-psychology your-users-are-lazy-vain-and-selfishdesign-accordingly &quot;, &quot;quote&quot;: &quot;你必须认为他们是自私、虚荣和懒惰的,对吧?他们来这里,根本没有学习新工具的欲望。那么,在最初的30秒内,你能给他们什么,让他们愿意接下来的30秒,然后再接下来的30秒都继续使用你的产品呢?&quot;, &quot;guest&quot;: &quot;grant lee&quot;, &quot;dimension&quot;: &quot;发现&quot;}]&#x27; data-read-more=了解更多></div></div><div class=wisdom-map-container><div id=sankeyContainer></div><aside id=detailPanel><div id=detailContent><p class=detail-placeholder>点击节点以过滤见解</p></div></aside></div></div><script>

        // Featured Insight for mobile view
        (function() {
            const container = document.getElementById('featuredInsight');
            if (!container) return;

            const candidatesData = container.dataset.candidates;
            const readMoreText = container.dataset.readMore || 'Read more';

            if (!candidatesData) return;

            const candidates = JSON.parse(candidatesData);
            if (candidates.length === 0) return;

            const featured = candidates[Math.floor(Math.random() * candidates.length)];

            const quoteHtml = featured.quote
                ? '<p class="featured-insight-quote">' + featured.quote + '</p>'
                : '';
            const guestHtml = featured.guest
                ? '<span class="featured-insight-guest">— ' + featured.guest + '</span>'
                : '';

            container.innerHTML = '<a href="' + featured.url + '" class="featured-insight" data-umami-event="featured-insight-click">' +
                '<p class="featured-insight-text">' + featured.text + '</p>' +
                quoteHtml +
                '<div class="featured-insight-meta">' +
                guestHtml +
                '<span class="featured-insight-link">' + readMoreText + ' <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span>' +
