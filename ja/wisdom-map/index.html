nsight data-candidates='[{"text": "最高のPMには、ある分野での深い専門性と、多くの分野での幅広い知識がある", "url": "/ja/craft/career-growth/the-best-pms-have-t-shaped-skills-deep-in-one-broad-in-many/", "quote": "私は優れたPMが常に中心にいるのは見たことがありません。優れたPMは常に端にいると感じています。優れたPMには必ず、データサイエンティストとしての卓越した能力や、ゼネラルマネージャーとしてリードし、人々を鼓舞する力、あるいは創造性に富み、チームを違う方法でリードできる人材がいます。", "guest": "Hari Srinivasan", "dimension": "Craft"}, {"text": "やる気を引き出すことに集中する - それが大きな影響力につながる", "url": "/ja/craft/career-growth/do-things-that-give-you-energy-thats-where-impact-lives/", "quote": "やる気を引き出す仕事に集中しましょう。それが大きな影響力につながります。", "guest": "Alex Komoroske", "dimension": "Craft"}, {"text": "AIは全てを書き換えている - 緊急に適応しないと時代遅れになる", "url": "/ja/strategy/vision-mission/ai-is-reshaping-everything-adapt-urgently-or-become-obsolete/", "quote": "目の前に迫る隕石だ。これが社会を根本的に変える。もし人々がAIを適切に探求しないなら、取り残されてしまう。", "guest": "Paul Adams", "dimension": "Strategy"}, {"text": "戦略とは大きな目標を立てることではなく、具体的な課題を解決することだ", "url": "/ja/strategy/vision-mission/strategy-is-solving-specific-problems-not-setting-ambitious/", "quote": "あなたの会社のミッションから、チームの個別の優先事項に至るまでの論理的な流れが見えるようになっていなければなりません。", "guest": "Maggie Crowley", "dimension": "Strategy"}, {"text": "組織構造が製品の成果を決める", "url": "/ja/leadership/org-design/organizational-structure-determines-product-outcomes/", "quote": "特定の人材がうまく機能するかどうかは、その人の能力や背景よりも、問題に対してどの様な技術セットが必要かが重要です。", "guest": "Brian Tolkin", "dimension": "Leadership"}, {"text": "AIによって組織が平坦化し、役割が曖昧になる", "url": "/ja/leadership/org-design/ai-will-flatten-organizations-and-blur-roles/", "quote": "私たちは、組織の中でスタックを崩壊させるような時代に入りつつあります。誰かに頼らずに自分でできることが増えていくのです。", "guest": "Scott Belsky", "dimension": "Leadership"}, {"text": "口コミで広がるよう設計する、小さな改善ではなく", "url": "/ja/growth/acquisition/build-for-word-of-mouth-not-incremental-improvement/", "quote": "ユーザーに予想外の体験をしてもらえる製品でなければ、友人に紹介されることはない。これまでにない全く新しいものを生み出したときこそ、ユーザーにアドボカシーしてもらえるのだ。", "guest": "Jag Duggal", "dimension": "Growth"}, {"text": "愛情がユーザーを熱心な支持者に変える", "url": "/ja/growth/acquisition/love-transforms-users-into-champions/", "quote":         // Featured Insight for mobile view
        (function() {
            const container = document.getElementById('featuredInsight');
            if (!container) return;

            const candidatesData = container.dataset.candidates;
            const readMoreText = container.dataset.readMore || 'Read more';

            if (!candidatesData) return;

            const candidates = JSON.parse(candidatesData);
            if (candidates.length === 0) return;

            const featured = candidates[Math.floor(Math.random() * candidates.length)];

            const quoteHtml = featured.quote
                ? '<p class="featured-insight-quote">' + featured.quote + '</p>'
                : '';
            const guestHtml = featured.guest
                ? '<span class="featured-insight-guest">— ' + featured.guest + '</span>'
                : '';

            container.innerHTML = '<a href="' + featured.url + '" class="featured-insight" data-umami-event="featured-insight-click">' +
                '<p class="featured-insight-text">' + featured.text + '</p>' +
                quoteHtml +
                '<div class="featured-insight-meta">' +
                guestHtml +
                '<span class="featured-insight-link">' + readMoreText + ' <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span>' +
