ates='[{"text": "최고의 PM들은 한 분야에 깊이 있고 여러 분야에 폭넓은 T자형 기술을 가지고 있습니다.", "url": "/ko/craft/career-growth/the-best-pms-have-t-shaped-skills-deep-in-one-broad-in-many/", "quote": "뛰어난 PM들은 늘 주변부에 있습니다. 데이터 과학에 탁월하거나 탁월한 GM이 되어 팀을 이끌고 영감을 주는 사람, 또는 창의성이 돋보여 팀을 다른 방식으로 이끌 수 있는 사람들이 으뜸이죠.", "guest": "Hari Srinivasan", "dimension": "Craft"}, {"text": "여러분에게 힘이 되는 일에 집중하세요. 그곳에 진정한 영향력이 있습니다.", "url": "/ko/craft/career-growth/do-things-that-give-you-energy-thats-where-impact-lives/", "quote": "여러분의 열정을 쏟을 수 있는 일에 전념하세요.", "guest": "Alex Komoroske", "dimension": "Craft"}, {"text": "AI가 모든 것을 재구성하고 있습니다 - 긴급하게 적응하지 않으면 구시대가 됩니다", "url": "/ko/strategy/vision-mission/ai-is-reshaping-everything-adapt-urgently-or-become-obsolete/", "quote": "이것은 당신에게 다가오는 운석입니다. 이것은 사회를 근본적으로 변화시킬 것입니다. 그리고 사람들이 AI를 제대로 탐구하지 않으면, 그들은 뒤쳐질 것이라고 생각합니다.", "guest": "Paul Adams", "dimension": "Strategy"}, {"text": "전략은 야심찬 목표를 세우는 것이 아니라 구체적인 문제를 해결하는 것입니다", "url": "/ko/strategy/vision-mission/strategy-is-solving-specific-problems-not-setting-ambitious/", "quote": "귀사의 사명에서부터 팀의 개별 우선순위까지 논리적인 연계를 보여줄 수 있어야 합니다.", "guest": "Maggie Crowley", "dimension": "Strategy"}, {"text": "조직 구조가 제품 성과를 결정한다", "url": "/ko/leadership/org-design/organizational-structure-determines-product-outcomes/", "quote": "다양한 유형의 PM이 있습니다. 이 사람이 좋은지 나쁜지가 문제가 아니라 문제를 해결하는데 필요한 기술과 경험이 중요합니다.", "guest": "Brian Tolkin", "dimension": "Leadership"}, {"text": "AI가 조직을 평준화하고 역할을 흐릿하게 만들 것이다", "url": "/ko/leadership/org-design/ai-will-flatten-organizations-and-blur-roles/", "quote": "우리는 더 이상 누군가에게 모든 것을 의존할 필요가 없는 시대에 진입하고 있습니다. 스스로 더 많은 것을 할 수 있게 될 것입니다.", "guest": "Scott Belsky", "dimension": "Leadership"}, {"text": "입소문을 통한 성장이 점진적인 개선보다 중요합니다.", "url": "/ko/growth/acquisition/build-for-word-of-mouth-not-incremental-improvement/", "quote": "단순히 점진적으로 더 나아지는 것만으로는 고객들이 주변에 말하게 할 수 없습니다. 근본적인 차별화가 있어야만 고객들이 자신의 친구들에게 소개할 것입니다. 지난 15년 동안 소음의 양이 엄청나게 늘었기 때문에, 점진적인 개선으로는 더 이상 효과가 없습니다.", "guest": "Jag Duggal", "dimension": "Growth"}, {"text": "사용자를 열렬한 지지자로 만드는 것이 중요합니다.", "url": "/ko/growth/acquisition/love-transforms-users-into-champions/", "quote": "당신이 진심으로 무언가를 믿지 않는다면 그것을 실현할 수 없습니다. 그래서 단순히 사용하는 것만으로는 사용자를 열렬한 지지자로 만드는 데 충분하지 않습니다.", "guest": "Claire Butler", "dimension": "Growth"}, {"text": "빠르게 출시하여 배우는 것이 완벽함을 추구하는 것보다 낫습니다.", "url": "/ko/execution/shipping-velocity/ship-to-learn-not-to-be-right/", "quote": "빠르게 출시하고 배우는 것이 원칙입니다. 실수할 것이고 더 자주 잘못될 것입니다.", "guest": "Paul Adams", "dimension": "Execution"}, {"text": "완벽할 필요는 없습니다. 괜찮은 수준의 제품을 빨리 출시하는 것이 중요합니다.", "url": "/ko/execution/shipping-velocity/good-enough-beats-perfect/", "quote": "완벽함을 추구하는 대신 ' 잘 된&#x27; 수준의 제품을 신속히 출시하는 것이 중요합니다. 제품을 출시하면 사용자로부터 많은 것을 배울 수 있기 때문입니다.&quot;, &quot;guest&quot;: &quot;julia schottenstein&quot;, &quot;dimension&quot;: &quot;execution&quot;}, {&quot;text&quot;: &quot;문제에서 시작하고 해결책을 찾아야 합니다&quot;, &quot;url&quot;: &quot; ko discovery problem-identification start-with-the-problem-not-the-solution &quot;, &quot;quote&quot;: &quot;문제에 더 많은 시간을 투자하세요.&quot;, &quot;guest&quot;: &quot;christopher lochhead&quot;, &quot;dimension&quot;: &quot;discovery&quot;}, {&quot;text&quot;: &quot;당신의 사용자는 게으르고 허영심 많으며 이기적입니다 - 이에 맞춰 설계하세요&quot;, &quot;url&quot;: &quot; ko discovery user-psychology your-users-are-lazy-vain-and-selfishdesign-accordingly &quot;, &quot;quote&quot;: &quot;당신의 사용자들은 이기적이고 허영심 많으며 게으릅니다. 그들이 새로운 도구를 배우려는 욕구가 없다는 점을 고려해야 합니다. 그들에게 30초 만에 무언가를 제공하여 다음 30초, 그리고 그 다음 30초까지 사용하게 만들어야 합니다.&quot;, &quot;guest&quot;: &quot;grant lee&quot;, &quot;dimension&quot;: &quot;discovery&quot;}]&#x27; data-read-more="더 읽어보기"></div></div><div class=wisdom-map-container><div id=sankeyContainer></div><aside id=detailPanel><div id=detailContent><p class=detail-placeholder>노드를 클릭하여 통찰 필터링</p></div></aside></div></div><script>

        // Featured Insight for mobile view
        (function() {
            const container = document.getElementById('featuredInsight');
            if (!container) return;

            const candidatesData = container.dataset.candidates;
            const readMoreText = container.dataset.readMore || 'Read more';

            if (!candidatesData) return;

            const candidates = JSON.parse(candidatesData);
            if (candidates.length === 0) return;

            const featured = candidates[Math.floor(Math.random() * candidates.length)];

            const quoteHtml = featured.quote
                ? '<p class="featured-insight-quote">' + featured.quote + '</p>'
                : '';
            const guestHtml = featured.guest
                ? '<span class="featured-insight-guest">— ' + featured.guest + '</span>'
                : '';

            container.innerHTML = '<a href="' + featured.url + '" class="featured-insight" data-umami-event="featured-insight-click">' +

                '<div class="featured-insight-meta">' +
                guestHtml +
